name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run tests
        run: go test -v ./...

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          COMMIT="${GITHUB_SHA:0:7}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          LDFLAGS="-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}"

          platforms=(
            "linux/amd64"
            "linux/arm64"
            "linux/arm"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "freebsd/amd64"
          )

          mkdir -p dist

          for platform in "${platforms[@]}"; do
            os="${platform%/*}"
            arch="${platform#*/}"
            binary="tmux-package-status"
            if [[ "$os" == "windows" ]]; then
              binary="${binary}.exe"
            fi

            echo "Building for $os/$arch..."
            GOOS="$os" GOARCH="$arch" go build -ldflags "${LDFLAGS}" -o "${binary}" ./cmd/tmux-package-status/

            # Create archive
            archive_name="tmux-package-status_${VERSION#v}_${os}_${arch}"
            if [[ "$os" == "windows" ]]; then
              zip "${archive_name}.zip" "${binary}" README.md LICENSE
              mv "${archive_name}.zip" dist/
            else
              tar -czvf "${archive_name}.tar.gz" "${binary}" README.md LICENSE
              mv "${archive_name}.tar.gz" dist/
            fi

            rm -f "${binary}"
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    name: Update Homebrew Formula
    runs-on: ubuntu-latest
    needs: [release]
    if: ${{ !contains(github.ref, '-rc') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') }}

    steps:
      - name: Trigger Homebrew update
        run: |
          echo "Homebrew formula update would be triggered here"
          echo "This requires a separate homebrew-tap repository"
